name: Release Core Package

# Manually trigger this workflow to package and release the STC8 Arduino Core
# Creates the core zip archive required by the Arduino Board Manager
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package STC Arduino Core
        run: |
          mkdir -p release-assets
          CORE_VER="${{ inputs.release_tag }}"
          CORE_VER="${CORE_VER#v}"
          echo "CORE_VER=${CORE_VER}" >> $GITHUB_ENV
          CORE_FOLDER="Arduino-STC8"
          CORE_ARCHIVE="Arduino-STC8-${CORE_VER}.zip"
          echo "CORE_ARCHIVE=${CORE_ARCHIVE}" >> $GITHUB_ENV

          echo "Packaging STC Arduino Core into ${CORE_ARCHIVE}..."
          # Ensure execution permissions for wrapper scripts
          chmod -R +x tools/wrapper/*.sh tools/wrapper/*.py 2>/dev/null || true

          # Prepare folder structure
          mkdir -p "${CORE_FOLDER}"
          cp -r boards.txt platform.txt programmers.txt cores libraries tools variants README.md "${CORE_FOLDER}/"

          # Create core zip archive containing the root folder
          zip -r "release-assets/${CORE_ARCHIVE}" "${CORE_FOLDER}"
          rm -rf "${CORE_FOLDER}"

          echo "Created release-assets/${CORE_ARCHIVE}"

      - name: Print Checksums for package_stc8051_index.json
        run: |
          echo "==========================================="
          echo "  CHECKSUMS FOR package_stc8051_index.json"
          echo "==========================================="
          for f in release-assets/*; do
            BASENAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c%s "$f")
            echo ""
            echo "File: ${BASENAME}"
            echo "  checksum: \"SHA-256:${SHA}\""
            echo "  size: \"${SIZE}\""
          done
          echo "==========================================="

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            ## STC Arduino Core ${{ inputs.release_tag }}

            Arduino support for STC8 microcontrollers.

            ### Supported Tools
            - **SDCC** 4.5.0
            - **stcgal** 1.10

            ### Installation
            Add this URL to Arduino IDE > File > Preferences > Additional Boards Manager URLs:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/package_stc8051_index.json
            ```
            Then search for "STC" in Boards Manager and install.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print next steps
        run: |
          echo ""
          echo "============================================================"
          echo "  DONE! Update package_stc8051_index.json with the"
          echo "  checksums and sizes printed above, then commit and push."
          echo "============================================================"
