name: Build Tool Archives

# Manually trigger this workflow to build SDCC and stcgal archives
# These archives are required by the Arduino Board Manager
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      sdcc_label_version:
        description: 'SDCC official version'
        required: true
        default: '4.5.0'
      stcgal_version:
        description: 'stcgal official version'
        required: true
        default: '1.0.0'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Package SDCC for Linux
  # Uses apt to install SDCC (avoids SourceForge download issues)
  # ──────────────────────────────────────────────────────────────
  build-sdcc-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install SDCC via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: Repackage SDCC
        run: |
          LABEL_VER="${{ inputs.sdcc_label_version }}"

          # Create the directory structure expected by platform.txt:
          #   bin/           -> sdcc, sdar, sdas8051, sdld, packihx
          #   share/sdcc/
          #     include/     -> header files
          #     lib/small/   -> small model libraries
          mkdir -p sdcc/bin
          mkdir -p sdcc/share/sdcc

          # Copy binaries from system install
          for bin in sdcc sdar sdas8051 sdld packihx sdnm sdobjcopy; do
            SRC=$(which $bin 2>/dev/null || true)
            if [ -n "$SRC" ]; then
              cp "$SRC" sdcc/bin/
              echo "Copied: $bin -> sdcc/bin/"
            else
              echo "Not found: $bin (skipping)"
            fi
          done
          chmod +x sdcc/bin/*

          # Copy includes and libraries from system paths
          SDCC_SHARE=$(sdcc --print-search-dirs 2>/dev/null | grep datadir | awk '{print $2}' || echo "/usr/share/sdcc")
          echo "SDCC share dir: $SDCC_SHARE"

          if [ -d "$SDCC_SHARE/include" ]; then
            cp -r "$SDCC_SHARE/include" sdcc/share/sdcc/
          elif [ -d "/usr/share/sdcc/include" ]; then
            cp -r /usr/share/sdcc/include sdcc/share/sdcc/
          fi

          if [ -d "$SDCC_SHARE/lib" ]; then
            cp -r "$SDCC_SHARE/lib" sdcc/share/sdcc/
          elif [ -d "/usr/share/sdcc/lib" ]; then
            cp -r /usr/share/sdcc/lib sdcc/share/sdcc/
          fi

          if [ -d "$SDCC_SHARE/non-free" ]; then
            cp -r "$SDCC_SHARE/non-free" sdcc/share/sdcc/
          elif [ -d "/usr/share/sdcc/non-free" ]; then
            cp -r /usr/share/sdcc/non-free sdcc/share/sdcc/
          fi

          # Show what we packaged
          echo "=== Package contents ==="
          find sdcc -type f | head -30
          echo "..."

          # Create the final archive containing top-level root folder
          ARCHIVE="sdcc-${LABEL_VER}-linux-x86_64.tar.gz"
          tar -czf "${ARCHIVE}" sdcc

          echo "Created: ${ARCHIVE}"
          ls -la "${ARCHIVE}"

          # Print checksum and size for package_stc8051_index.json
          echo "=== CHECKSUM ==="
          echo "SHA-256: $(sha256sum ${ARCHIVE} | awk '{print $1}')"
          echo "Size: $(stat -c%s ${ARCHIVE})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-linux
          path: sdcc-${{ inputs.sdcc_label_version }}-linux-x86_64.tar.gz

  # ──────────────────────────────────────────────────────────────
  # Job 2: Package SDCC for Windows
  # Uses choco to install SDCC (avoids SourceForge download issues)
  # ──────────────────────────────────────────────────────────────
  build-sdcc-windows:
    runs-on: windows-latest
    steps:
      - name: Install SDCC on Windows
        shell: pwsh
        run: |
          try {
            Write-Host "Attempting SDCC installation via Winget..."
            winget install SDCC.SDCC --accept-source-agreements --accept-package-agreements -e --silent
          } catch {
            Write-Host "Winget failed or not available, falling back to direct setup download..."
          }

          # Check if SDCC installed
          $sdccExe = Get-Command sdcc.exe -ErrorAction SilentlyContinue
          if (-not $sdccExe -and -not (Test-Path "C:\Program Files\SDCC\bin\sdcc.exe")) {
            Write-Host "Downloading SDCC 4.5.0 installer..."
            $url = "https://sourceforge.net/projects/sdcc/files/sdcc-win64/4.5.0/sdcc-4.5.0-x64-setup.exe/download"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $webClient = New-Object System.Net.WebClient
            $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
            $webClient.DownloadFile($url, "sdcc-setup.exe")
            
            Write-Host "Installing SDCC silently to C:\SDCC..."
            Start-Process -FilePath ".\sdcc-setup.exe" -ArgumentList "/S", "/D=C:\SDCC" -Wait
          }

      - name: Repackage SDCC
        shell: pwsh
        run: |
          $labelVer = "${{ inputs.sdcc_label_version }}"

          # Find the actual SDCC install directory dynamically
          # Choco may install to various locations, so find sdcc.exe first
          $sdccExe = Get-Command sdcc.exe -ErrorAction SilentlyContinue
          if (-not $sdccExe) {
            # Search common locations
            $searchPaths = @(
              "C:\SDCC",
              "C:\Program Files\SDCC",
              "C:\Program Files (x86)\SDCC",
              "C:\tools\sdcc",
              "C:\ProgramData\chocolatey\lib\sdcc\tools"
            )
            foreach ($p in $searchPaths) {
              $candidate = Join-Path $p "bin\sdcc.exe"
              if (Test-Path $candidate) {
                $sdccExe = Get-Item $candidate
                break
              }
            }
          }
          if (-not $sdccExe) {
            Write-Error "Could not find sdcc.exe!"
            exit 1
          }

          # Derive the install directory (go up from bin/sdcc.exe)
          $sdccBinDir = if ($sdccExe.Source) { Split-Path $sdccExe.Source } else { Split-Path $sdccExe.FullName }
          $sdccDir = Split-Path $sdccBinDir
          Write-Host "SDCC found at: $sdccDir"
          Get-ChildItem $sdccDir

          # Create repackaged directory structure expected by platform.txt (Windows):
          #   sdcc/
          #     bin/         -> sdcc.exe, sdar.exe, packihx.exe, etc.
          #     include/     -> header files (NO share/sdcc/ prefix)
          #     lib/         -> libraries (NO share/sdcc/ prefix)
          $repackDir = "sdcc"
          New-Item -ItemType Directory -Path "$repackDir\bin" -Force
          New-Item -ItemType Directory -Path "$repackDir\include" -Force
          New-Item -ItemType Directory -Path "$repackDir\lib" -Force

          # Copy binaries
          $binFiles = @("sdcc.exe", "sdar.exe", "sdas8051.exe", "sdld.exe", "packihx.exe", "sdnm.exe", "sdobjcopy.exe")
          foreach ($f in $binFiles) {
            $src = Join-Path $sdccDir "bin\$f"
            if (Test-Path $src) {
              Copy-Item $src "$repackDir\bin\"
              Write-Host "Copied: $f"
            } else {
              Write-Host "Not found: $f (skipping)"
            }
          }

          # Copy includes
          if (Test-Path "$sdccDir\include") {
            Copy-Item -Recurse "$sdccDir\include\*" "$repackDir\include\"
          }

          # Copy libraries
          if (Test-Path "$sdccDir\lib") {
            Copy-Item -Recurse "$sdccDir\lib\*" "$repackDir\lib\"
          }

          # Copy non-free if present
          if (Test-Path "$sdccDir\non-free") {
            Copy-Item -Recurse "$sdccDir\non-free" "$repackDir\"
          }

          # Show what we packaged
          Write-Host "=== Package contents ==="
          Get-ChildItem -Recurse $repackDir | Select-Object -First 30

          # Create the zip archive with top-level root directory
          $archive = "sdcc-${labelVer}-windows-x86_64.zip"
          Compress-Archive -Path $repackDir -DestinationPath $archive
          Write-Host "Created: $archive"
          Get-Item $archive

          # Print checksum and size
          $hash = Get-FileHash $archive -Algorithm SHA256
          $size = (Get-Item $archive).Length
          Write-Host "=== CHECKSUM ==="
          Write-Host "SHA-256: $($hash.Hash.ToLower())"
          Write-Host "Size: $size"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-windows
          path: sdcc-${{ inputs.sdcc_label_version }}-windows-x86_64.zip

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build stcgal standalone binary for Linux
  # ──────────────────────────────────────────────────────────────
  build-stcgal-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stcgal and PyInstaller
        run: |
          pip install stcgal pyinstaller pyserial

      - name: Build standalone binary
        run: |
          # Find the main entry script
          STCGAL_SCRIPT=$(which stcgal)
          echo "stcgal script at: ${STCGAL_SCRIPT}"

          # Build standalone binary with PyInstaller
          pyinstaller \
            --onefile \
            --name stcgal \
            --hidden-import serial \
            --hidden-import serial.tools \
            --hidden-import serial.tools.list_ports \
            --hidden-import stcgal.protocols \
            --hidden-import stcgal.models \
            --hidden-import stcgal.utils \
            --collect-all stcgal \
            "${STCGAL_SCRIPT}"

          # Verify the binary was created
          ls -la dist/stcgal
          echo "stcgal binary built successfully"

      - name: Create wrapper script and package
        run: |
          LABEL_VER="${{ inputs.stcgal_version }}"
          mkdir -p stcgal

          # Copy the standalone binary
          cp dist/stcgal stcgal/
          chmod +x stcgal/stcgal

          # Create the wrapper shell script
          echo '#!/bin/bash' > stcgal/stcgal.sh
          echo '# stcgal wrapper for Arduino IDE' >> stcgal/stcgal.sh
          echo '# Passes all arguments to the stcgal binary' >> stcgal/stcgal.sh
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> stcgal/stcgal.sh
          echo '"${SCRIPT_DIR}/stcgal" "$@"' >> stcgal/stcgal.sh
          chmod +x stcgal/stcgal.sh

          # Create the archive with top-level root folder
          ARCHIVE="stcgal-${LABEL_VER}-linux-x86_64.tar.gz"
          tar -czf "${ARCHIVE}" stcgal

          echo "Created: ${ARCHIVE}"
          ls -la "${ARCHIVE}"

          # Print checksum and size
          echo "=== CHECKSUM ==="
          echo "SHA-256: $(sha256sum ${ARCHIVE} | awk '{print $1}')"
          echo "Size: $(stat -c%s ${ARCHIVE})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stcgal-linux
          path: stcgal-${{ inputs.stcgal_version }}-linux-x86_64.tar.gz

  # ──────────────────────────────────────────────────────────────
  # Job 4: Build stcgal standalone binary for Windows
  # ──────────────────────────────────────────────────────────────
  build-stcgal-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stcgal and PyInstaller
        shell: pwsh
        run: |
          pip install stcgal pyinstaller pyserial

      - name: Build standalone binary
        shell: pwsh
        run: |
          # Create a small entry-point script instead of using the pip wrapper
          # (the pip-generated stcgal.exe has encoding issues with PyInstaller)
          $entryScript = "import stcgal.frontend`nstcgal.frontend.cli()"
          Set-Content -Path "stcgal_entry.py" -Value $entryScript -Encoding UTF8
          Write-Host "Created stcgal_entry.py"
          Get-Content stcgal_entry.py

          # Build standalone exe with PyInstaller
          pyinstaller --onefile --name stcgal --hidden-import serial --hidden-import serial.tools --hidden-import serial.tools.list_ports --hidden-import stcgal.protocols --hidden-import stcgal.models --hidden-import stcgal.utils --collect-all stcgal stcgal_entry.py

          # Verify the binary was created
          Get-Item dist\stcgal.exe
          Write-Host "stcgal.exe built successfully"

      - name: Create wrapper and package
        shell: pwsh
        run: |
          $labelVer = "${{ inputs.stcgal_version }}"
          New-Item -ItemType Directory -Path "stcgal" -Force

          # Copy the standalone exe
          Copy-Item "dist\stcgal.exe" "stcgal\"

          # Create the wrapper batch script
          $lines = @("@echo off", "REM stcgal wrapper for Arduino IDE", "REM Passes all arguments to the stcgal binary", """%~dp0stcgal.exe"" %*")
          $lines -join "`r`n" | Set-Content -Path "stcgal\stcgal.bat" -NoNewline -Encoding ASCII

          # Create the zip archive with top-level root directory
          $archive = "stcgal-${labelVer}-windows-x86_64.zip"
          Compress-Archive -Path "stcgal" -DestinationPath $archive
          Write-Host "Created: $archive"
          Get-Item $archive

          # Print checksum and size
          $hash = Get-FileHash $archive -Algorithm SHA256
          $size = (Get-Item $archive).Length
          Write-Host "=== CHECKSUM ==="
          Write-Host "SHA-256: $($hash.Hash.ToLower())"
          Write-Host "Size: $size"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stcgal-windows
          path: stcgal-${{ inputs.stcgal_version }}-windows-x86_64.zip

  # ──────────────────────────────────────────────────────────────
  # Job 5: Create GitHub Release with all archives
  # ──────────────────────────────────────────────────────────────
  create-release:
    needs: [build-sdcc-linux, build-sdcc-windows, build-stcgal-linux, build-stcgal-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and compute checksums
        run: |
          echo "=== Collected Archives ==="
          find artifacts -type f | sort

          # Move all archives to a flat directory
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;

          echo ""
          echo "=== Release Assets ==="
          ls -la release-assets/

          echo ""
          echo "==========================================="
          echo "  CHECKSUMS FOR package_stc8051_index.json"
          echo "==========================================="
          for f in release-assets/*; do
            BASENAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c%s "$f")
            echo ""
            echo "File: ${BASENAME}"
            echo "  checksum: \"SHA-256:${SHA}\""
            echo "  size: \"${SIZE}\""
          done
          echo "==========================================="

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "STC Arduino Core ${{ inputs.release_tag }}"
          body: |
            ## STC Arduino Core ${{ inputs.release_tag }}

            Arduino support for STC8 microcontrollers.

            ### Bundled Tools
            - **SDCC** ${{ inputs.sdcc_label_version }}
            - **stcgal** ${{ inputs.stcgal_version }} (standalone binary, no Python required)

            ### Installation
            Add this URL to Arduino IDE > File > Preferences > Additional Boards Manager URLs:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/package_stc8051_index.json
            ```
            Then search for "STC" in Boards Manager and install.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print next steps
        run: |
          echo ""
          echo "============================================================"
          echo "  DONE! Update package_stc8051_index.json with the"
          echo "  checksums and sizes printed above, then commit and push."
          echo "============================================================"
