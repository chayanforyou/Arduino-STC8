name: Build Tool Archives

# Manually trigger this workflow to package SDCC and build stcgal archives
# These archives are required by the Arduino Board Manager
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      sdcc_label_version:
        description: 'SDCC official version'
        required: true
        default: '4.5.0'
      stcgal_version:
        description: 'stcgal official version'
        required: true
        default: '1.10'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built tool archives
        run: |
          SDCC_VER="${{ inputs.sdcc_label_version }}"
          STCGAL_VER="${{ inputs.stcgal_version }}"
          BASE_URL="https://github.com/chayanforyou/Arduino-STC8/releases/download/tools"

          mkdir -p release-assets

          # List of archives to download
          FILES=(
            "sdcc-${SDCC_VER}-linux-x86_64.tar.gz"
            "sdcc-${SDCC_VER}-windows-x86_64.zip"
            "stcgal-${STCGAL_VER}-linux-x86_64.tar.gz"
            "stcgal-${STCGAL_VER}-windows-x86_64.zip"
          )

          for ARCHIVE in "${FILES[@]}"; do
            echo "Downloading ${ARCHIVE} from ${BASE_URL}/${ARCHIVE}..."
            curl -fL -o "release-assets/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          done

          echo ""
          echo "=== Downloaded Assets ==="
          ls -lh release-assets/

      - name: Print Checksums for package_stc8051_index.json
        run: |
          echo "==========================================="
          echo "  CHECKSUMS FOR package_stc8051_index.json"
          echo "==========================================="
          for f in release-assets/*; do
            BASENAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c%s "$f")
            echo ""
            echo "File: ${BASENAME}"
            echo "  checksum: \"SHA-256:${SHA}\""
            echo "  size: \"${SIZE}\""
          done
          echo "==========================================="

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "STC Arduino Core ${{ inputs.release_tag }}"
          body: |
            ## STC Arduino Core ${{ inputs.release_tag }}

            Arduino support for STC8 microcontrollers.

            ### Bundled Tools
            - **SDCC** ${{ inputs.sdcc_label_version }}
            - **stcgal** ${{ inputs.stcgal_version }}

            ### Installation
            Add this URL to Arduino IDE > File > Preferences > Additional Boards Manager URLs:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/package_stc8051_index.json
            ```
            Then search for "STC" in Boards Manager and install.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print next steps
        run: |
          echo ""
          echo "============================================================"
          echo "  DONE! Update package_stc8051_index.json with the"
          echo "  checksums and sizes printed above, then commit and push."
          echo "============================================================"
