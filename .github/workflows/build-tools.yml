name: Build Tool Archives

# Manually trigger this workflow to package SDCC and build stcgal archives
# These archives are required by the Arduino Board Manager
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      sdcc_label_version:
        description: 'SDCC official version'
        required: true
        default: '4.5.0'
      stcgal_version:
        description: 'stcgal official version'
        required: true
        default: '1.10'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Download pre-built SDCC for Linux
  # ──────────────────────────────────────────────────────────────
  build-sdcc-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Download pre-built SDCC for Linux
        run: |
          LABEL_VER="${{ inputs.sdcc_label_version }}"
          ARCHIVE="sdcc-${LABEL_VER}-linux-x86_64.tar.gz"
          URL="https://github.com/chayanforyou/Arduino-STC8/releases/download/tools/${ARCHIVE}"
          echo "Downloading SDCC Linux from: ${URL}"
          curl -fL -o "${ARCHIVE}" "${URL}"

          echo "Downloaded: ${ARCHIVE}"
          ls -la "${ARCHIVE}"

          # Print checksum and size for package_stc8051_index.json
          echo "=== CHECKSUM ==="
          echo "SHA-256: $(sha256sum ${ARCHIVE} | awk '{print $1}')"
          echo "Size: $(stat -c%s ${ARCHIVE})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-linux
          path: sdcc-${{ inputs.sdcc_label_version }}-linux-x86_64.tar.gz

  # ──────────────────────────────────────────────────────────────
  # Job 2: Download pre-built SDCC for Windows
  # ──────────────────────────────────────────────────────────────
  build-sdcc-windows:
    runs-on: windows-latest
    steps:
      - name: Download pre-built SDCC for Windows
        shell: pwsh
        run: |
          $labelVer = "${{ inputs.sdcc_label_version }}"
          $archive = "sdcc-${labelVer}-windows-x86_64.zip"
          $url = "https://github.com/chayanforyou/Arduino-STC8/releases/download/tools/${archive}"
          Write-Host "Downloading SDCC Windows from: $url"
          Invoke-WebRequest -Uri $url -OutFile $archive

          Write-Host "Downloaded: $archive"
          Get-Item $archive

          # Print checksum and size
          $hash = Get-FileHash $archive -Algorithm SHA256
          $size = (Get-Item $archive).Length
          Write-Host "=== CHECKSUM ==="
          Write-Host "SHA-256: $($hash.Hash.ToLower())"
          Write-Host "Size: $size"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-windows
          path: sdcc-${{ inputs.sdcc_label_version }}-windows-x86_64.zip

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build stcgal standalone binary for Linux
  # ──────────────────────────────────────────────────────────────
  build-stcgal-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stcgal and PyInstaller
        run: |
          pip install stcgal pyinstaller pyserial

      - name: Build standalone binary
        run: |
          # Find the main entry script
          STCGAL_SCRIPT=$(which stcgal)
          echo "stcgal script at: ${STCGAL_SCRIPT}"

          # Build standalone binary with PyInstaller
          pyinstaller \
            --onefile \
            --name stcgal \
            --hidden-import serial \
            --hidden-import serial.tools \
            --hidden-import serial.tools.list_ports \
            --hidden-import stcgal.protocols \
            --hidden-import stcgal.models \
            --hidden-import stcgal.utils \
            --collect-all stcgal \
            "${STCGAL_SCRIPT}"

          # Verify the binary was created
          ls -la dist/stcgal
          echo "stcgal binary built successfully"

      - name: Create wrapper script and package
        run: |
          LABEL_VER="${{ inputs.stcgal_version }}"
          mkdir -p stcgal

          # Copy the standalone binary
          cp dist/stcgal stcgal/
          chmod +x stcgal/stcgal

          # Create the wrapper shell script
          echo '#!/bin/bash' > stcgal/stcgal.sh
          echo '# stcgal wrapper for Arduino IDE' >> stcgal/stcgal.sh
          echo '# Passes all arguments to the stcgal binary' >> stcgal/stcgal.sh
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> stcgal/stcgal.sh
          echo '"${SCRIPT_DIR}/stcgal" "$@"' >> stcgal/stcgal.sh
          chmod +x stcgal/stcgal.sh

          # Create the archive with top-level root folder
          ARCHIVE="stcgal-${LABEL_VER}-linux-x86_64.tar.gz"
          tar -czf "${ARCHIVE}" stcgal

          echo "Created: ${ARCHIVE}"
          ls -la "${ARCHIVE}"

          # Print checksum and size
          echo "=== CHECKSUM ==="
          echo "SHA-256: $(sha256sum ${ARCHIVE} | awk '{print $1}')"
          echo "Size: $(stat -c%s ${ARCHIVE})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stcgal-linux
          path: stcgal-${{ inputs.stcgal_version }}-linux-x86_64.tar.gz

  # ──────────────────────────────────────────────────────────────
  # Job 4: Build stcgal standalone binary for Windows
  # ──────────────────────────────────────────────────────────────
  build-stcgal-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stcgal and PyInstaller
        shell: pwsh
        run: |
          pip install stcgal pyinstaller pyserial

      - name: Build standalone binary
        shell: pwsh
        run: |
          $entryScript = "import stcgal.frontend`nstcgal.frontend.cli()"
          Set-Content -Path "stcgal_entry.py" -Value $entryScript -Encoding UTF8
          Write-Host "Created stcgal_entry.py"
          Get-Content stcgal_entry.py

          # Build standalone exe with PyInstaller
          pyinstaller --onefile --name stcgal --hidden-import serial --hidden-import serial.tools --hidden-import serial.tools.list_ports --hidden-import stcgal.protocols --hidden-import stcgal.models --hidden-import stcgal.utils --collect-all stcgal stcgal_entry.py

          # Verify the binary was created
          Get-Item dist\stcgal.exe
          Write-Host "stcgal.exe built successfully"

      - name: Create wrapper and package
        shell: pwsh
        run: |
          $labelVer = "${{ inputs.stcgal_version }}"
          New-Item -ItemType Directory -Path "stcgal" -Force

          # Copy the standalone exe
          Copy-Item "dist\stcgal.exe" "stcgal\"

          # Create the wrapper batch script
          $lines = @("@echo off", "REM stcgal wrapper for Arduino IDE", "REM Passes all arguments to the stcgal binary", """%~dp0stcgal.exe"" %*")
          $lines -join "`r`n" | Set-Content -Path "stcgal\stcgal.bat" -NoNewline -Encoding ASCII

          # Create the zip archive with top-level root directory
          $archive = "stcgal-${labelVer}-windows-x86_64.zip"
          Compress-Archive -Path "stcgal" -DestinationPath $archive
          Write-Host "Created: $archive"
          Get-Item $archive

          # Print checksum and size
          $hash = Get-FileHash $archive -Algorithm SHA256
          $size = (Get-Item $archive).Length
          Write-Host "=== CHECKSUM ==="
          Write-Host "SHA-256: $($hash.Hash.ToLower())"
          Write-Host "Size: $size"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stcgal-windows
          path: stcgal-${{ inputs.stcgal_version }}-windows-x86_64.zip

  # ──────────────────────────────────────────────────────────────
  # Job 5: Create GitHub Release with all archives
  # ──────────────────────────────────────────────────────────────
  create-release:
    needs: [build-sdcc-linux, build-sdcc-windows, build-stcgal-linux, build-stcgal-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and compute checksums
        run: |
          echo "=== Collected Archives ==="
          find artifacts -type f | sort

          # Move all archives to a flat directory
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;

          echo ""
          echo "=== Release Assets ==="
          ls -la release-assets/

          echo ""
          echo "==========================================="
          echo "  CHECKSUMS FOR package_stc8051_index.json"
          echo "==========================================="
          for f in release-assets/*; do
            BASENAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c%s "$f")
            echo ""
            echo "File: ${BASENAME}"
            echo "  checksum: \"SHA-256:${SHA}\""
            echo "  size: \"${SIZE}\""
          done
          echo "==========================================="

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "STC Arduino Core ${{ inputs.release_tag }}"
          body: |
            ## STC Arduino Core ${{ inputs.release_tag }}

            Arduino support for STC8 microcontrollers.

            ### Bundled Tools
            - **SDCC** ${{ inputs.sdcc_label_version }}
            - **stcgal** ${{ inputs.stcgal_version }} (standalone binary, no Python required)

            ### Installation
            Add this URL to Arduino IDE > File > Preferences > Additional Boards Manager URLs:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/package_stc8051_index.json
            ```
            Then search for "STC" in Boards Manager and install.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print next steps
        run: |
          echo ""
          echo "============================================================"
          echo "  DONE! Update package_stc8051_index.json with the"
          echo "  checksums and sizes printed above, then commit and push."
          echo "============================================================"
